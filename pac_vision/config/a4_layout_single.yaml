# 기준물이 A4 한 장일 때의 배치 (python scripts/calibrate.py --layout single). base_ref 좌표 (m), +X 앞, +Y 왼쪽, +Z 위.
# 두 장(a4_layout.yaml, 29.7 x 42.0 cm)보다 기준이 작아 회전 오차가 커지므로, 가능하면 두 장을 쓴다.
# - 종이 한 장(21.0 x 29.7 cm)에 대각선 두 개: 교차점 = base (0, 0, 0) = 종이 한가운데.
# - X 화살표: 교차점을 지나 긴 변(29.7 cm)과 평행, 앞쪽(+X). 화살표 쪽이 로봇의 앞.
# - 꼭짓점 1-4: 위에서 볼 때 반시계. 1 뒤-오른쪽, 2 앞-오른쪽, 3 앞-왼쪽, 4 뒤-왼쪽 (앞 = 화살표 쪽, 오른쪽 = -Y).
#   1→2와 3→4가 긴 변(29.7 cm), 2→3과 4→1이 짧은 변(21.0 cm).
# - 이음매 점이 없으므로 calibrate.py --check의 이음매 검증점은 쓰지 않는다 (재점검 꼭짓점과 다른 테이프 점을 쓴다).

base_point: [0.0, 0.0, 0.0]

# 위에서 볼 때 반시계 순서. 클릭 순서는 base → 꼭짓점 1 → 2 → 3 → 4
corners:
  - [-0.1485, -0.105, 0.0]   # 꼭짓점 1: 뒤-오른쪽
  - [ 0.1485, -0.105, 0.0]   # 꼭짓점 2: 앞-오른쪽
  - [ 0.1485,  0.105, 0.0]   # 꼭짓점 3: 앞-왼쪽
  - [-0.1485,  0.105, 0.0]   # 꼭짓점 4: 뒤-왼쪽

# 재점검용 테이프를 붙일 꼭짓점 번호
recheck_corner: 4
